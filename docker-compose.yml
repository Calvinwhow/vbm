# docker-compose.yml
version: "3.9"

services:
  neuroimaging-pipeline:
    image: calvinwhow/vbm-neuroimaging-pipeline:latest
    platform: linux/amd64
    build:
     context: .
     dockerfile: containers/pipeline.Dockerfile
    environment:
      - THREADS=-1
      - SESSION=ses-01
      - T1_DIR=anat
      - T1_FILE=T1
      - CTRL_DIST=ctrl_dist_young_atrophy_only
      - ATROPHY_ONLY=true
    volumes:
      - /Users/cu135/hires_backdrops/test_atrophy:/root/data       #<--- use this to mount the BIDS directory containing your T1 scans
      # - ${PWD}/assets:/root/assets
      # - ${PWD}/scripts:/root/scripts
    command: ["bash", "/root/scripts/run_pipeline.sh" ]